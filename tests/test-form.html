<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Browser-Use Skill Test Form</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin: 1rem 0; padding: 1rem; border: 1px solid #ccc; border-radius: 4px; }
  legend { font-weight: bold; padding: 0 0.5rem; }
  label { display: block; margin: 0.5rem 0 0.2rem; font-size: 0.9rem; color: #555; }
  input[type="text"], input[type="email"], input[type="password"], input[type="date"],
  input[type="time"], input[type="datetime-local"], input[type="color"], input[type="number"],
  textarea, select { width: 100%; padding: 0.4rem; box-sizing: border-box; margin-bottom: 0.3rem; }
  input[type="range"] { width: 100%; }
  .radio-group label, .checkbox-group label { display: inline-block; margin-right: 1rem; }
  .autocomplete-wrapper { position: relative; }
  .autocomplete-wrapper input { width: 100%; padding: 0.4rem; box-sizing: border-box; }
  .ac-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: white;
    border: 1px solid #ccc; max-height: 200px; overflow-y: auto; display: none; z-index: 10; }
  .ac-dropdown [role="option"] { padding: 0.4rem 0.6rem; cursor: pointer; }
  .ac-dropdown [role="option"]:hover, .ac-dropdown [role="option"].highlighted { background: #e0e7ff; }
  #result { background: #f0fdf4; border: 1px solid #86efac; padding: 1rem; border-radius: 4px;
    margin-top: 1rem; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; display: none; }
  button[type="submit"] { background: #2563eb; color: white; padding: 0.6rem 2rem; border: none;
    border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Test Form</h1>
<form id="testForm">

  <!-- 1. Basic text inputs -->
  <fieldset>
    <legend>Text Inputs</legend>
    <label for="firstName">First Name</label>
    <input type="text" id="firstName" name="firstName" required>
    <label for="lastName">Last Name</label>
    <input type="text" id="lastName" name="lastName" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password">
  </fieldset>

  <!-- 2. Dotted field names -->
  <fieldset>
    <legend>Dotted Names</legend>
    <label for="addr-street">Street</label>
    <input type="text" id="addr-street" name="customer.address.street">
    <label for="addr-city">City</label>
    <input type="text" id="addr-city" name="customer.address.city">
  </fieldset>

  <!-- 3. Radio buttons (value differs from label) -->
  <fieldset>
    <legend>Employment Status</legend>
    <div class="radio-group">
      <label><input type="radio" name="employment" value="opt1"> Student</label>
      <label><input type="radio" name="employment" value="opt2"> Employed</label>
      <label><input type="radio" name="employment" value="opt3"> Freelancer</label>
    </div>
  </fieldset>

  <!-- 4. Checkboxes with [] in name (same-name group) -->
  <fieldset>
    <legend>Skills</legend>
    <div class="checkbox-group">
      <label><input type="checkbox" name="skills[]" value="js"> JavaScript</label>
      <label><input type="checkbox" name="skills[]" value="py"> Python</label>
      <label><input type="checkbox" name="skills[]" value="go"> Go</label>
      <label><input type="checkbox" name="skills[]" value="rust"> Rust</label>
    </div>
  </fieldset>

  <!-- 5. Native select (single + multi) -->
  <fieldset>
    <legend>Dropdowns</legend>
    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Select...</option>
      <option value="us">United States</option>
      <option value="uk">United Kingdom</option>
      <option value="de">Germany</option>
      <option value="jp">Japan</option>
      <option value="br">Brazil</option>
    </select>
    <label for="languages">Languages (multi)</label>
    <select id="languages" name="languages" multiple size="4">
      <option value="en">English</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
    </select>
  </fieldset>

  <!-- 6. Range slider -->
  <fieldset>
    <legend>Experience</legend>
    <label for="experience">Years of experience: <span id="exp-display">5</span></label>
    <input type="range" id="experience" name="experience" min="0" max="20" value="5">
  </fieldset>

  <!-- 7. Date/time inputs -->
  <fieldset>
    <legend>Dates</legend>
    <label for="birthdate">Birth Date</label>
    <input type="date" id="birthdate" name="birthdate">
    <label for="meeting-time">Meeting Time</label>
    <input type="time" id="meeting-time" name="meetingTime">
    <label for="appointment">Appointment</label>
    <input type="datetime-local" id="appointment" name="appointment">
  </fieldset>

  <!-- 8. Color picker -->
  <fieldset>
    <legend>Preferences</legend>
    <label for="favcolor">Favorite Color</label>
    <input type="color" id="favcolor" name="favcolor" value="#3b82f6">
  </fieldset>

  <!-- 9. Textarea -->
  <fieldset>
    <legend>Comments</legend>
    <label for="comments">Additional comments</label>
    <textarea id="comments" name="comments" rows="3"></textarea>
  </fieldset>

  <!-- 10. Autocomplete (JS-powered typeahead) -->
  <fieldset>
    <legend>Autocomplete</legend>
    <label for="ac-framework">Framework</label>
    <div class="autocomplete-wrapper">
      <input type="text" id="ac-framework" name="framework" role="combobox"
             autocomplete="off" aria-expanded="false" placeholder="Type to search...">
      <div class="ac-dropdown" id="ac-dropdown" role="listbox"></div>
    </div>
  </fieldset>

  <button type="submit" name="submitBtn">Submit</button>
</form>

<div id="result"></div>

<script>
// Slider display update
document.getElementById('experience').addEventListener('input', function() {
  document.getElementById('exp-display').textContent = this.value;
});

// Autocomplete widget
const acData = ['React', 'Vue', 'Angular', 'Svelte', 'Next.js', 'Nuxt', 'Remix', 'Astro', 'SolidJS', 'Preact'];
const acInput = document.getElementById('ac-framework');
const acDropdown = document.getElementById('ac-dropdown');

acInput.addEventListener('input', function() {
  const val = this.value.toLowerCase();
  if (!val) { acDropdown.style.display = 'none'; return; }
  const matches = acData.filter(f => f.toLowerCase().includes(val));
  if (matches.length === 0) { acDropdown.style.display = 'none'; return; }
  acDropdown.innerHTML = matches.map(m =>
    `<div role="option" data-value="${m}">${m}</div>`
  ).join('');
  acDropdown.style.display = 'block';
  acInput.setAttribute('aria-expanded', 'true');
});

acDropdown.addEventListener('click', function(e) {
  const opt = e.target.closest('[role="option"]');
  if (opt) {
    acInput.value = opt.dataset.value;
    acDropdown.style.display = 'none';
    acInput.setAttribute('aria-expanded', 'false');
    acInput.dispatchEvent(new Event('change', {bubbles: true}));
  }
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('.autocomplete-wrapper')) {
    acDropdown.style.display = 'none';
  }
});

// Form submission — collect and display all values
document.getElementById('testForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const fd = new FormData(this);
  const data = {};
  for (const [key, val] of fd.entries()) {
    if (data[key]) {
      if (!Array.isArray(data[key])) data[key] = [data[key]];
      data[key].push(val);
    } else {
      data[key] = val;
    }
  }
  const el = document.getElementById('result');
  el.style.display = 'block';
  el.textContent = JSON.stringify(data, null, 2);
});
</script>
</body>
</html>
